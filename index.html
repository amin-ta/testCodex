    <section class="mb-8">
      <h2 class="text-white text-xl font-bold mb-3">Purchase History</h2>
      <div class="flex mb-2 gap-2">
        <input id="searchInput" placeholder="Search order or status" class="p-2 rounded bg-[#222e1f] text-white flex-1" />
        <button onclick="searchOrders()" class="px-4 py-2 rounded bg-[#8cd279] text-[#171f14] font-bold">Search</button>
      </div>
      <div class="overflow-hidden rounded-xl border border-[#445c3d]">
        <table class="w-full" id="ordersTable">
          <thead class="bg-[#222e1f] text-left text-white">
            <tr>
              <th class="px-4 py-3">Date</th>
              <th class="px-4 py-3">Order</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3">Total</th>
            </tr>
          </thead>
          <tbody id="ordersBody" class="text-[#a4be9d]"></tbody>
        </table>
      </div>
      <!-- Add Order Form -->
      <div class="mt-4 space-y-2">
        <h3 class="text-white font-bold">Add Order</h3>
        <div class="flex gap-2 flex-wrap">
          <input id="dateInput" type="date" class="p-2 rounded bg-[#222e1f] text-white" />
          <input id="orderInput" placeholder="Order #" class="p-2 rounded bg-[#222e1f] text-white" />
          <input id="statusInput" placeholder="Status" class="p-2 rounded bg-[#222e1f] text-white" />
          <input id="totalInput" placeholder="Total" class="p-2 rounded bg-[#222e1f] text-white" />
          <button onclick="addOrder()" class="px-4 py-2 rounded bg-[#8cd279] text-[#171f14] font-bold">Add</button>
        </div>
      </div>
    </section>

    <section class="mb-8">
      <h2 class="text-white text-xl font-bold mb-3">Seller Tools</h2>
      <button class="px-4 py-2 rounded bg-[#8cd279] text-[#171f14] font-bold">Download Verified Seller Badge</button>
    </section>
  </div>

<script>
  const orders = [
    { date: '05/12/2024', order: 'Order #12345', status: 'Shipped', total: '$25.00' },
    { date: '04/28/2024', order: 'Order #67890', status: 'Delivered', total: '$35.00' },
    { date: '03/15/2024', order: 'Order #11223', status: 'Completed', total: '$45.00' },
  ];

  function renderOrders(list) {
    const tbody = document.getElementById('ordersBody');
    tbody.innerHTML = '';
    list.forEach(o => {
      const row = document.createElement('tr');
      row.className = 'border-t border-[#445c3d]';
      row.innerHTML = `
        <td class="px-4 py-2">${o.date}</td>
        <td class="px-4 py-2">${o.order}</td>
        <td class="px-4 py-2"><span class="px-4 py-1 rounded-full bg-[#2f402b] text-white">${o.status}</span></td>
        <td class="px-4 py-2">${o.total}</td>`;
      tbody.appendChild(row);
    });
  }

  function addOrder() {
    const date = document.getElementById('dateInput').value;
    const order = document.getElementById('orderInput').value;
    const status = document.getElementById('statusInput').value;
    const total = document.getElementById('totalInput').value;
    if (!date || !order || !status || !total) return alert('Fill all fields');
    orders.push({ date, order, status, total });
    renderOrders(orders);
  }

  function searchOrders() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = orders.filter(o =>
      o.order.toLowerCase().includes(query) ||
      o.status.toLowerCase().includes(query)
    );
    renderOrders(filtered);
  }

  // initial render
  document.addEventListener('DOMContentLoaded', () => {
    renderOrders(orders);
  });
</script>
